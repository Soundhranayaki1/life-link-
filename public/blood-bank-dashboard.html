<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Bank Portal – LIFE LINK</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/api.js" defer></script>
  <script src="js/dashboards.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="nav-wrapper">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-mark">✚</div>
        <span>LIFE LINK</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="find-donors.html" class="nav-link">Find Donors</a></li>
          <li><a href="emergency-requests.html" class="nav-link">Blood Requests</a></li>
          <li><a href="blood-banks.html" class="nav-link">Blood Banks & Stock</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="navAuthContainer"></div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Blood Bank Stock Management</h1>
        <p class="page-subtitle">Update and maintain live available blood unit stock levels</p>
      </div>
    </div>

    <!-- Update Form -->
    <div class="card card-body" style="margin-bottom: 2rem; max-width: 580px;">
      <h3 style="margin-bottom: 1.25rem;">Update Blood Stock Inventory</h3>
      <form id="stockUpdateForm">
        <div class="grid-3">
          <div class="form-group">
            <label class="form-label">Blood Group</label>
            <select id="updateBloodGroup" class="form-select">
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Action</label>
            <select id="updateAction" class="form-select">
              <option value="add">Add Units (+)</option>
              <option value="subtract">Deduct Units (-)</option>
              <option value="set">Set Exact Total</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Unit Count</label>
            <input type="number" id="updateUnits" class="form-control" min="1" value="5" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Update Stock Record
        </button>
      </form>
    </div>

    <!-- Inventory Display Grid -->
    <h2 style="margin-bottom: 1.25rem; font-size: 1.35rem;">Current Inventory Breakdown</h2>
    <div id="bankStockDisplayGrid" class="grid-4">
      <!-- Loaded dynamically -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>© 2026 LIFE LINK Healthcare System</p>
    </div>
  </footer>

</body>
</html>
